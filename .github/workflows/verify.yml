name: verify
on: [pull_request]

jobs:
  local:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NFSE_Escritorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update && sudo apt-get install -y xmlsec1
      - run: pip install openpyxl fastapi uvicorn httpx python-multipart "psycopg[binary]>=3.2" "lxml>=6.0,<6.2" "PyJWT[crypto]>=2.10,<3" "cryptography>=50,<51" "boto3>=1.35,<2" playwright
      - run: python -m playwright install --with-deps chromium
      - run: bun install
      - name: Start preview for E2E
        run: |
          bun run dev -- --host 127.0.0.1 --port 8080 > /tmp/nfse-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nfse-vite.log
          exit 1
      - run: python scripts/verify.py --mode local
      # Nunca transmite documentos oficiais em PR.

  identity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NFSE_Escritorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastapi httpx python-multipart "psycopg[binary]>=3.2" "PyJWT[crypto]>=2.10,<3" "cryptography>=50,<51" "boto3>=1.35,<2"
      - name: Verify Supabase identity increment
        run: python -m unittest tests.test_auth tests.test_api tests.test_preflight -v
        working-directory: NFSE_Escritorio/backend

  storage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NFSE_Escritorio/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "boto3>=1.35,<2" "PyJWT[crypto]>=2.10,<3" "cryptography>=50,<51"
      - name: Verify private Supabase Storage increment
        run: python -m unittest tests.test_storage -v

