[project]
name = "nfse-imoveis-fiscal"
version = "0.1.0"
description = "Serviço fiscal separado (API + worker) do NFS-e Imóveis — Atual Assessoria"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary]>=3.2",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "lxml>=6.0,<6.2",     # verificado com 6.0.2 e 6.1.3 (libxml2 2.14.6); C14N de subárvore via cópia destacada
  "cryptography>=50,<51",  # verificado com 50.0.2; XMLDSIG RSA (perfil criptográfico ainda não confirmado oficialmente)
  "PyJWT[crypto]>=2.10,<3",  # validação de JWT/JWKS do Supabase Auth
  "boto3>=1.35,<2",  # Supabase Storage via endpoint S3 compatível
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]  # + binário xmlsec1 1.3.x (verificação independente)

[tool.pytest.ini_options]
testpaths = ["tests"]
