name: verify
on: [pull_request]
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: oven-sh/setup-bun@v2
      - run: pip install openpyxl fastapi httpx python-multipart && bun install
      - run: python scripts/verify.py --mode local
      # Nunca transmite documentos oficiais em PR.
